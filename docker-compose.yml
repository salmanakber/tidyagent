services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: tidyagent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tidyagent
      POSTGRES_PASSWORD: tidyagent
      POSTGRES_DB: tidyagent
    ports:
      - "5432:5432"
    volumes:
      - tidyagent_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: tidyagent-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  tidyagent_pg:
