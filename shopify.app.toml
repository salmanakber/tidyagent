# tidyAgent Shopify app configuration (CLI / Dev Dashboard).
# Fill client_id with the API key from Admin → Settings → Shopify (or Partner Dashboard).
# After editing, run: shopify app deploy
#
# Privacy webhooks are required for App Store distribution. You can ALSO paste the same
# HTTPS URL in Partner Dashboard → App setup → GDPR / privacy webhooks. For CLI-managed
# apps, TOML + deploy is the source of truth — pasting the URL alone is not enough.

client_id = "YOUR_SHOPIFY_API_KEY"
name = "tidyAgent"
application_url = "https://agent.tidyflowapp.com/shopify"
embedded = true

[access_scopes]
scopes = "read_products,read_orders,read_customers,read_content,read_themes,read_script_tags,write_script_tags,read_locales"

[auth]
redirect_urls = [ "https://agent.tidyflowapp.com/api/shopify/oauth/callback" ]

[webhooks]
api_version = "2024-07"

[[webhooks.subscriptions]]
compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]
uri = "https://agent.tidyflowapp.com/api/shopify/webhooks"
