<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>tidyAgent</title>
    <style>
      html,
      body,
      iframe {
        margin: 0;
        width: 100%;
        height: 100%;
        border: 0;
        background: #0b1220;
      }
    </style>
  </head>
  <body>
    <iframe
      id="tidyagent"
      title="tidyAgent dashboard"
      src="https://agent.tidyflowapp.com/webflow?embed=1"
      allow="clipboard-write"
    ></iframe>
    <script>
      (function () {
        var frame = document.getElementById("tidyagent");
        if (!frame) return;
        var params = new URLSearchParams();
        params.set("embed", "1");
        try {
          if (window.webflow && typeof window.webflow.getSiteInfo === "function") {
            window.webflow.setExtensionSize({ width: 480, height: 720 });
            window.webflow.getSiteInfo().then(function (info) {
              if (info && info.siteId) params.set("siteId", info.siteId);
              frame.src = "https://agent.tidyflowapp.com/webflow?" + params.toString();
            });
            return;
          }
        } catch (error) {}
        frame.src = "https://agent.tidyflowapp.com/webflow?" + params.toString();
      })();
    </script>
  </body>
</html>
