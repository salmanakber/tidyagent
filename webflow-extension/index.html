<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>tidyAgent</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #0b1220;
        color: #94a3b8;
        font-family: system-ui, sans-serif;
      }
      p {
        margin: 24px;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <p>Opening tidyAgent…</p>
    <script>
      (function () {
        var app = "https://agent.tidyflowapp.com/webflow";
        var params = new URLSearchParams();
        params.set("embed", "1");

        function go() {
          location.replace(app + "?" + params.toString());
        }

        try {
          if (window.webflow) {
            if (typeof window.webflow.setExtensionSize === "function") {
              window.webflow.setExtensionSize({ width: 480, height: 720 });
            }
            if (typeof window.webflow.getSiteInfo === "function") {
              window.webflow.getSiteInfo().then(function (info) {
                if (info && info.siteId) params.set("siteId", info.siteId);
                go();
              }).catch(go);
              return;
            }
          }
        } catch (error) {}
        go();
      })();
    </script>
  </body>
</html>
